<style data-app-loading="inject-css">
  #__app-loading__ {
    --loading-bg: #f4f7f9;
    --loading-track: #dbe4ee;
    --loading-accent: #006fe6;
    --loading-logo-size: 72px;

    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: var(--loading-bg);
    opacity: 1;
    visibility: visible;
    transition:
      opacity 600ms ease-out,
      visibility 0s linear 600ms;
  }

  /* 与 Vben 一致：主题脚本给 html 打 dark class */
  html.dark #__app-loading__,
  .dark #__app-loading__ {
    --loading-bg: #101722;
    --loading-track: #2b3749;
    --loading-accent: #5ba5ff;
  }

  #__app-loading__.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #__app-loading__ .starship-loading__group {
    display: grid;
    justify-items: center;
    gap: 20px;
    /* 画面焦点略高于正中；矮屏限制上移幅度 */
    transform: translateY(max(-42px, -5vh));
  }

  #__app-loading__ .starship-loading__logo {
    display: block;
    inline-size: var(--loading-logo-size);
    block-size: var(--loading-logo-size);
  }

  #__app-loading__ .starship-loading__track {
    position: relative;
    overflow: hidden;
    inline-size: 64px;
    block-size: 4px;
    background: var(--loading-track);
    clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
  }

  #__app-loading__ .starship-loading__track::before {
    position: absolute;
    inset: 0 auto 0 0;
    inline-size: 22px;
    background: var(--loading-accent);
    clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
    content: '';
    animation: starship-loading-pass 1500ms cubic-bezier(0.4, 0, 0.3, 1) infinite;
  }

  @keyframes starship-loading-pass {
    from {
      transform: translateX(-22px);
    }

    to {
      transform: translateX(64px);
    }
  }

  @media (max-width: 480px), (max-height: 420px) {
    #__app-loading__ {
      --loading-logo-size: 60px;
    }

    #__app-loading__ .starship-loading__group {
      gap: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #__app-loading__ {
      transition: none;
    }

    #__app-loading__ .starship-loading__track::before {
      animation: none;
      transform: translateX(21px);
    }
  }
</style>
<div id="__app-loading__" class="loading" role="status" aria-label="系统正在加载">
  <div class="starship-loading__group" aria-hidden="true">
    <img
      class="starship-loading__logo"
      src="/logo.png"
      alt=""
      width="72"
      height="72"
      fetchpriority="high"
    />
    <span class="starship-loading__track"></span>
  </div>
</div>
